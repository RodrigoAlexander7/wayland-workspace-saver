[package]
name = "cosmic-workspace-saver"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
cosmic-protocols = { path = "./experiments/cosmic-protocols", features = ["client"] }